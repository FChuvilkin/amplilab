<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awora | AmpliLab</title>
  <!-- Deliberately no Amplitude (or any other) tracking on this page. It only links to the variants. -->
  <link rel="icon" href="shared/brand/awora-mark.svg" type="image/svg+xml">
  <!-- Same Awora branding as the variant pages: fonts, palette, header, buttons and badges come from shared/lab.css. -->
  <link rel="stylesheet" href="shared/lab.css">
  <style>
    .hero { padding: 40px 0 36px; }
    .hero .eyebrow { margin-bottom: 14px; }
    .hero h1 { font-size: clamp(36px, 5vw, 56px); line-height: 1.08; margin: 0 0 16px; letter-spacing: -.01em; }
    .hero h1 em { font-style: italic; color: var(--rust); }
    .lede { max-width: 680px; margin: 0; font-size: 18px; color: var(--ink-2); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 18px; }
    .card { display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 24px; transition: border-color .3s var(--ease), transform .3s var(--ease); }
    .card.live:hover { border-color: var(--ink-soft); transform: translateY(-2px); }
    .card.planned { background: transparent; }
    .card h2 { font-size: 24px; line-height: 1.2; margin: 0 0 12px; }
    .card p { flex: 1; margin: 0 0 18px; font-size: 14px; color: var(--ink-2); }
    .card-status { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
    .card-status::before { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--sage-3); }
    .card.live .card-status { color: var(--sage); }
    .card.live .card-status::before { background: var(--sage); }
    .card-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .card-badges .badge { font-size: 12px; padding: 3px 10px; }
    .card.planned .badge { background: var(--sage-3); color: var(--ink-2); }
    .card-meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 20px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; }
    .card-meta dt { color: var(--ink-soft); font-weight: 500; }
    .card-meta dd { margin: 0; font-family: var(--font-mono); color: var(--ink); word-break: break-all; }
    .card .btn { align-self: flex-start; }
    .btn[aria-disabled="true"] { color: var(--ink-soft); border-color: var(--line); cursor: default; pointer-events: none; }

    .foot { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }
    .foot code { background: var(--sage-3); color: var(--ink); padding: 1px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <header class="lab-strip">
    <div class="strip-row">
      <a href="./" class="strip-home" aria-label="Awora">
        <img class="strip-logo" src="shared/brand/awora-wordmark.svg" alt="Awora" width="1784" height="335">
      </a>
      <span class="strip-spacer"></span>
      <a href="./" class="strip-home" aria-label="AmpliLab home"><span class="strip-name">AmpliLab</span></a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Implement Amplitude, your way</h1>
    </section>

    <div class="grid" id="cards"></div>

  </main>

  <script src="registry.js"></script>
  <script>
    function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    document.getElementById('cards').innerHTML = window.LAB_REGISTRY.slice().sort(function (a, b) { return (b.status === 'live') - (a.status === 'live'); }).map(function (v) {
      var live = v.status === 'live';
      return '<article class="card ' + esc(v.status) + '" id="card-' + esc(v.slug) + '">' +
        '<div class="card-status">' + esc(v.status) + '</div>' +
        '<h2>' + esc(v.title) + '</h2>' +
        '<div class="card-badges">' + v.products.map(function (p) { return '<span class="badge">' + esc(p) + '</span>'; }).join('') + '</div>' +
        '<p>' + esc(v.method) + '</p>' +
        (live
          ? '<a class="btn btn-primary" id="open-' + esc(v.slug) + '" href="' + esc(v.slug) + '/">Open ' + esc(v.slug) + ' →</a>'
          : '<span class="btn btn-secondary" aria-disabled="true">Not built yet</span>') +
        '</article>';
    }).join('');
  </script>
</body>
</html>
